name: Populate Hopsworks Feature Store

on:
  workflow_dispatch:

jobs:
  populate-feature-store:
    runs-on: ubuntu-latest

    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Hopsworks
        run: |
          python -m pip install "hopsworks==5.0.6"
          python -m pip install "deltalake==1.6.3"

      - name: Verify Hopsworks installation
        run: |
          python -c "import hopsworks; print('Hopsworks:', hopsworks.__version__)"

      - name: Populate Hopsworks Feature Group
        run: |
          python src/features/populate_hopsworks.py